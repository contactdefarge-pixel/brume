name: Build Brume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          BRUME_UPDATE_TOKEN: ${{ secrets.BRUME_UPDATE_TOKEN }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBRUME_VERSION=1.0.${{ github.run_number }}

      - name: Build
        run: cmake --build build --config Release --target Brume_VST3 Brume_Standalone BrumeStation_VST3 BrumeStation_Standalone ${{ matrix.name == 'macOS' && 'Brume_AU BrumeStation_AU' || '' }} --parallel 4

      - name: Package (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Brume | Out-Null
          Copy-Item -Recurse build/Brume_artefacts/Release/VST3/Brume.vst3 Brume/
          Copy-Item build/Brume_artefacts/Release/Standalone/Brume.exe Brume/
          Copy-Item -Recurse "build/BrumeStation_artefacts/Release/VST3/Brume Station.vst3" Brume/
          Copy-Item "build/BrumeStation_artefacts/Release/Standalone/Brume Station.exe" Brume/
          Copy-Item INSTALL.txt Brume/
          Compress-Archive -Path Brume -DestinationPath Brume-Windows.zip

      - name: Package (macOS)
        if: matrix.name == 'macOS'
        run: |
          mkdir -p Brume
          cp -R build/Brume_artefacts/Release/VST3/Brume.vst3 Brume/
          cp -R build/Brume_artefacts/Release/AU/Brume.component Brume/
          cp -R build/Brume_artefacts/Release/Standalone/Brume.app Brume/
          cp -R "build/BrumeStation_artefacts/Release/VST3/Brume Station.vst3" Brume/
          cp -R "build/BrumeStation_artefacts/Release/AU/Brume Station.component" Brume/
          cp -R "build/BrumeStation_artefacts/Release/Standalone/Brume Station.app" Brume/
          cp INSTALL.txt Brume/
          # ad-hoc signature so macOS accepts the bundles locally
          codesign --force --deep -s - Brume/Brume.vst3 Brume/Brume.component Brume/Brume.app \
            "Brume/Brume Station.vst3" "Brume/Brume Station.component" "Brume/Brume Station.app"
          # ditto keeps permissions and bundle structure (a plain zip would break the app)
          ditto -c -k --sequesterRsrc --keepParent Brume Brume-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Brume-${{ matrix.name }}
          path: Brume-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "Brume $TAG" \
            --notes "Téléchargez Brume-macOS.zip (Mac) ou Brume-Windows.zip (Windows). Installation : voir INSTALL.txt dans l'archive." \
            --latest
